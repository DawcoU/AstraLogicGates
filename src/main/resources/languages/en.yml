  copy-success: "&aSuccessfully copied &e{COUNT} &agates to clipboard!"
  clipboard-empty: "&cYour clipboard is empty! Use /ars copy first"
  paste-success: "&aSuccessfully pasted &e{COUNT} &agates!"
  rotate-success: "&7Rotated clipboard contents by &f{DEGREE} &7degrees"
  invalid-rotate-angle: "&cInvalid angle! Use 90, -90, or 180"
  undo-success: "&aLast paste undone (&7{COUNT} gates&a)"
  nothing-to-undo: "&cYou have nothing to undo!"
  redo-success: "&eSuccessfully redone last undo (&7{COUNT} &egates)."
  nothing-to-redo: "&cThere is nothing to redo!"

