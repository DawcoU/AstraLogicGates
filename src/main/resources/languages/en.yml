  invalid-sign: "&cThis is not a valid mathematical operator!"
  invalid-string-sign: "&cThis is not a valid string operator!"
  negative-number: "&cYou cannot enter a negative number!"
  min-greater-than-max: "&cThe min number cannot be greater than the max number!"
  not-a-number: "&cThis is not a number!"
  limit-range: "&cThe limit must be in the range 1-1000!"
  provide-range: "&cPlease specify a range (1-15)!"
  range-out-of-bounds: "&cThe range must be in the range 1-15!"
  provide-time: "&cProvide time (1t-10s)!"
  provide-unit: "&cProvide a unit: &e't' &7(ticks) &cor &e's' &7(seconds)&c!"
