  # --- Gate Edit Mode ---
  edit-mode-start: "&7You have entered gate edit mode: &6{TYPE}"
  edit-cancelled: "&cEditing has been canceled."
  edit-unknown-command: "&cUnknown edit command! Type &7cancel&c to exit."
  edit-format-error: "&cError! The value entered must be a number."

  # Instructions displayed on click (usually without prefix)
  edit-value-info: "&7Enter: &fvalue: <number>"
  edit-mode-info: "&7Enter: &fmode: <ADD|SUB|MUL|DIV|POW> &7or &f<==|>|<|>=|!=|...>"
  edit-random-info: "&7Enter: &fmin: <number> &7or &fmax: <number>"
  edit-limit-info: "&7Enter: &flimit: <number> &8(Current: {CURRENT})"
  edit-range-info: "&7Enter: &frange: <number> &8(Current: {CURRENT})"
  edit-time-info: "&7Enter: &ftime: <number>s &7or &f<number>t"
  edit-cancel-info: "&7Enter &ccancel&7 to exit without changes."

  # Confirm changes
  value-set: "&7New value set: &f{VAL}"
  mode-set: "&7Operation mode set: &f{MODE}"
  limit-set: "&7Counter limit set: &f{VAL}"
  min-set: "&7Minimum set: &f{VAL}"
  max-set: "&7Maximum set: &f{VAL}"
  time-set: "&7Time set: &f{VAL}"
  range-set: "&7Sensor range set: &f{VAL}"

