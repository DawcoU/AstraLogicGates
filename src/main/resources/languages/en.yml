  schema-save-success: "&aSchema &e%NAME% &ahas been successfully saved to disk! &7(%COUNT% gates)"
  schema-save-error: "&cA critical error occurred while saving the schema!"
  schema-not-found: "&cSchema file named &e%NAME%.yml &cwas not found in the plugin folder"
  schema-corrupted: "&cThe schema file is empty, corrupted, or has an invalid YAML structure"
  schema-load-success: "&aSchema &e%NAME% &7(%COUNT% gates) &ahas been loaded into the clipboard! Type the paste command to place it in the world"
  schema-specify-action: "&cYou must choose an action! Correct usage: &e/ars schematic <save/load/delete> [name]"
  schema-unknown-action: "&cUnknown schema action! Available options are: &esave&c, &eload &cor &edelete"
  schema-specify-name: "&cYou must specify the schema name! Correct usage: &e/ars schematic <save/load/delete> [name]"
  schema-invalid-name: "&cThe schema name contains invalid characters! Use only letters, digits, _ and -"
  schema-deleted: "&aSuccessfully deleted the schema &e%NAME%.yml &afrom the server files"
  schema-delete-error: "&cAn error occurred while deleting the file &e%NAME%.yml&c!"
  schema-file-exists: "&cThe schema file &e%NAME%.yml &cexists!"
  schema-usage-delete: "&cCorrect usage: &e/ars schematic delete <name>"

  # Others
  gate-received: "&aYou received a gate: &e{TYPE}"
  unknown-type-gate: "&cUnknown gate type!"