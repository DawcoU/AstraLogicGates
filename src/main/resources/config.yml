# +---------------------------------------------------------------------------+
# |                     AstraRedstoneSystems - Configuration file             |
# +---------------------------------------------------------------------------+

# =========================================
#             General Settings
# =========================================
settings:
  # Wybierz język pluginu (Dostępne: pl, en)
  # Select the plugin language (Available: pl, en)
  language: pl

  # Should the plugin check for newer versions of the plugin?
  check-updates: true

  # Should debug output from logic gates be sent to the console?
  debug-mode: false

# ==========================================
#              Logic Gate Setup
# ==========================================
gates:
  data-gates:
    battery:
      decay-time-minutes: 5 # Every how many minutes should it discharge one percent?
      charge-time-seconds: 5 # Every how many seconds should it charge at one percent?